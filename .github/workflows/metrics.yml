name: Profile Metrics

on:
  schedule:
    # 07:23 in Bangkok, daily.
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

concurrency:
  group: profile-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check metrics access
        id: access
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Add the METRICS_TOKEN repository secret, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Overview and pull requests
        if: steps.access.outputs.ready == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SugguSCH
          filename: metrics/overview.svg
          base: header, activity, community
          config_timezone: Asia/Bangkok
          plugin_followup: yes
          plugin_followup_sections: user
          plugins_errors_fatal: yes

      - name: Contribution calendar
        if: steps.access.outputs.ready == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SugguSCH
          filename: metrics/calendar.svg
          base: ''
          config_timezone: Asia/Bangkok
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes

      - name: Habits, languages, contributions and activity
        if: steps.access.outputs.ready == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SugguSCH
          filename: metrics/details.svg
          base: ''
          config_timezone: Asia/Bangkok
          config_order: languages, notable
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_analysis_timeout: 2
          plugin_languages_analysis_timeout_repositories: 1
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 100
          plugin_languages_details: percentage
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugins_errors_fatal: yes

      - name: Check out generated images
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update activity images
        if: steps.access.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/activity.py
          if [ -n "$(git status --porcelain -- metrics/habits.svg metrics/recent-languages.svg metrics/recent-activity.svg)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add metrics/habits.svg metrics/recent-languages.svg metrics/recent-activity.svg
            git commit -m 'Update GitHub activity images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
